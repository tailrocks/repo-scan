name: macOS
"on":
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  macos:
    name: macOS / repo-scan
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Record tool provenance
        if: always()
        run: |
          rustc --version
          rustc --version --verbose
          cargo --version
          shasum -a 256 "$GITHUB_WORKSPACE/Cargo.lock"
          echo "runner_image_os=$ImageOS runner_image_version=$ImageVersion"
          sw_vers
          echo "source_oid=$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
