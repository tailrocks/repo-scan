# RSF-SEC-AUDIT-GATE: enforced dependency-audit gate.
# Trust boundary (CI-SC-01/CI-SC-03): on pull_request this file runs from the
# PR merge tree, so tool installation must never execute PR-controlled Cargo
# config: checkout persists no credentials, and installs run outside the
# checkout with an isolated CARGO_HOME. Branch protection must require the
# `audit` check; see docs/AUDIT_GATE.md. Any edit here is tamper-evident via
# required review plus the tests/sec_audit_gate.rs regression tests.
name: audit
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly: advisories land between pushes
permissions:
  contents: read
concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Remove persisted credentials
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          test -z "$(git config --local --get-all 'http.https://github.com/.extraheader' || true)"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.85.0
        with:
          toolchain: 1.85.0
      - name: Verify pinned tool archives
        working-directory: ${{ runner.temp }}
        run: |
          verify_crate() {
            file="$RUNNER_TEMP/$1-$2.crate"
            curl -fsSL --retry 3 -o "$file" "https://static.crates.io/crates/$1/$1-$2.crate"
            actual="$(sha256sum "$file" | cut -d' ' -f1)"
            rm -f "$file"
            test "$actual" = "$3" || { echo "::error::sha256 mismatch for $1-$2.crate: got $actual, want $3"; exit 1; }
            echo "$1-$2.crate sha256 OK"
          }
          verify_crate cargo-audit 0.21.0 57398cd543d453b628230e3d855dcbe257a415715cb5687326a092c466d5d230
          verify_crate cargo-deny 0.18.3 9ed51dacad2ea0880a689cb64bdd52cbae3b44578c19833f6cc4e66ebea8d914
      - name: Install cargo-audit
        working-directory: ${{ runner.temp }}
        run: |
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
          mkdir -p "$CARGO_HOME"
          # crates.io sha256: 57398cd543d453b628230e3d855dcbe257a415715cb5687326a092c466d5d230
          cargo install cargo-audit --version 0.21.0 --locked
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Install cargo-deny
        working-directory: ${{ runner.temp }}
        run: |
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
          mkdir -p "$CARGO_HOME"
          # crates.io sha256: 9ed51dacad2ea0880a689cb64bdd52cbae3b44578c19833f6cc4e66ebea8d914
          cargo install cargo-deny --version 0.18.3 --locked
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Deny advisories
        run: |
          export PATH="$RUNNER_TEMP/cargo-home/bin:$PATH"
          cargo-audit audit --file "$GITHUB_WORKSPACE/Cargo.lock" --deny warnings
      - name: Deny unlicensed/unknown-source deps
        run: |
          export PATH="$RUNNER_TEMP/cargo-home/bin:$PATH"
          cargo-deny --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" check --locked
      - name: Record tool provenance
        if: always()
        run: |
          export PATH="$RUNNER_TEMP/cargo-home/bin:$PATH"
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          rustc --version
          cargo-audit --version
          cargo-deny --version
          sha256sum "$GITHUB_WORKSPACE/Cargo.lock"
          echo "source_oid=$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
          db_found=0
          for db in "$CARGO_HOME"/advisory-dbs/*/; do
            if [ -d "$db/.git" ]; then
              echo "advisory_db=$db"
              git -C "$db" rev-parse HEAD
              db_found=1
            fi
          done
          test "$db_found" = "1" || { echo "::error::advisory database checkout missing under $CARGO_HOME/advisory-dbs"; exit 1; }
