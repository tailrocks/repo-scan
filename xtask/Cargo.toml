[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

# Proof acceptance runner (goal section 3). Dependency-light by contract:
# clap + serde + serde_json + sha2 only, at versions already present in the
# workspace Cargo.lock so `--locked` stays satisfiable.

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
sha2 = "=0.11.0"
