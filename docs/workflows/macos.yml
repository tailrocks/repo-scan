# RSF-CI-MACOS: macOS CI gate (clippy + tests) and release check.
# Provenance: maintained input at docs/workflows/macos.yml. Under Velnor's
# whole-tree model `.github/` is exclusively generated by `velnor-actions`
# (see docs/CI.md), which is Linux-x64-only and has no macOS-runner,
# release-build, or consumer-audit story. Like docs/workflows/audit.yml,
# this file must be re-applied to `.github/workflows/macos.yml` after each
# `velnor-actions generate` (the `plan` job's generate check diffs `.github`
# against a fresh generate, so velnor-owned files cannot carry these jobs).
# Trust boundary (CI-SC-01/CI-SC-03): on pull_request this file runs from the
# PR merge tree, so checkout persists no credentials and the extraheader
# scrub below fails closed if any remain. Unlike the audit gate, these jobs
# MUST compile repository code, so PR-controlled `.cargo/config.toml` is
# necessarily honored during the build (same property as velnor's Linux
# `rust-repo-scan` job); the pinned toolchain plus `--locked` keeps the
# compiler and the dependency graph deterministic. Branch protection must
# require the `macos` and `release` checks; see docs/CI.md. Any edit here is
# tamper-evident via required review.
# Toolchain: 1.98.1, matching velnor's qualified Linux pin (docs/CI.md), so
# both platforms compile with the same rustc. The action pins below are the
# same exact SHAs as docs/workflows/audit.yml.
name: macos
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    # RS-CI-01: GitHub-hosted labels take no digest, so full image
    # immutability needs a self-hosted or container runner pinned by digest
    # (owner action, see docs/AUDIT_GATE.md §1). Until then the exact image
    # version is recorded in the provenance step below.
    # Apple Silicon runner: exercises the `objc2-core-services`/`dispatch2`
    # FSEvents backends, `libc` getfsstat paths, and cfg-gated modules under
    # `src/platform/` and `src/walk/` that Linux builds compile out.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Remove persisted credentials
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          test -z "$(git config --local --get-all 'http.https://github.com/.extraheader' || true)"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.85.0
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Clippy
        run: cargo clippy --locked --manifest-path Cargo.toml --package repo-scan --all-targets -- -D warnings
      - name: Unit and integration tests
        run: cargo test --locked --manifest-path Cargo.toml --package repo-scan --lib --tests
      - name: Doctests
        run: cargo test --locked --manifest-path Cargo.toml --package repo-scan --doc
      - name: Record tool provenance
        if: always()
        run: |
          rustc --version
          rustc --version --verbose
          shasum -a 256 "$GITHUB_WORKSPACE/Cargo.lock"
          echo "runner_image_os=$ImageOS runner_image_version=$ImageVersion"
          sw_vers
          uname -a
          echo "source_oid=$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
  release:
    # Release check on both platforms: `cargo build --release` exists in
    # neither velnor's Linux job set nor the `macos` job above.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Remove persisted credentials
        run: |
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          test -z "$(git config --local --get-all 'http.https://github.com/.extraheader' || true)"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.85.0
        with:
          toolchain: 1.98.1
      - name: Release build
        run: cargo build --release --locked --manifest-path Cargo.toml --package repo-scan
      - name: Record tool provenance
        if: always()
        run: |
          rustc --version
          rustc --version --verbose
          echo "runner_image_os=$ImageOS runner_image_version=$ImageVersion"
          uname -a
          echo "source_oid=$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
